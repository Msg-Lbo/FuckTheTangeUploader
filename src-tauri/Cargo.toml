[package]
name = "fuck-the-tange-uploader"
version = "0.1.3"
description = "固件版本推送工具"
edition = "2021"

[lib]
name = "fuck_the_tange_uploader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
russh = { version = "0.62", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "2.4"
md5 = "0.7"
tokio = { version = "1", features = ["full"] }
dirs = "5"

# Windows 上 rustc 编译巨型 crate（如 windows）带 debuginfo 会 STATUS_STACK_BUFFER_OVERRUN 崩溃，关掉调试信息规避
[profile.dev]
debug = 0

[profile.release]
debug = 0
